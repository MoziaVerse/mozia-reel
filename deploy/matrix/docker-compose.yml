# MoziaReel（ArcReel 下游发行版）on Matrix —— 独立 SaaS 形态（非 per-user 容器实例）
#
# 单实例多租户：租户 = matrix ssoSub，由服务端从会话 cookie 解出并强制，
# 项目数据、DB、生成队列 worker 均按租户分流（见 lib/tenant_context.py）。
#
# 与上游 deploy/docker-compose.yml 的区别：
#   - 自建镜像（含 matrix 握手与租户隔离 overlay），不用 ghcr 官方镜像
#   - 关掉 ArcReel 自带 auth，访问控制交给 MatrixSessionGate 中间件
#   - 经 VITE_BRAND_* build-arg 做白牌化（AGPL 合规说明见 MODIFICATIONS.md）
#   - 不挂 ./.env 进容器：凭据走 env_file，容器内不需要可写 .env
#     （上游挂 .env 是为了首启把自动生成的密码回写，AUTH_ENABLED=false 后这条路径不走）

services:
  mozia-reel:
    image: mozia-reel:latest
    build:
      context: ../..
      dockerfile: Dockerfile
      # 这台构建机出网慢：实测 deb.debian.org 50KB/s vs 阿里 620KB/s（12×），
      # pypi.org 40KB/s vs 阿里 208KB/s（5×）。Dockerfile 里默认空值不启用，
      # 只有这里显式传了才走镜像源。
      args:
        APT_MIRROR: mirrors.aliyun.com
        PIP_INDEX: https://mirrors.aliyun.com/pypi/simple/
        NPM_REGISTRY: https://registry.npmmirror.com
        # 白牌化：只改产品显示名与副标题。NOTICE §7(b) 的 "Powered by ArcReel"
        # 署名句与仓库链接不受此影响，在设置→关于页内逐字保留。
        VITE_BRAND_NAME: MoziaReel
        VITE_BRAND_TAGLINE: AI 视频创作工作台
        VITE_BRAND_DESCRIPTION: AI 视频创作工作台，把小说、剧本或商品素材转化为角色一致、过程可控的短视频。
        # ⚠️ 对外提供服务前必须填：AGPL §13 要求使用者能取得本运行版本对应的完整源码。
        #    留空会渲染成上游仓库地址——对本修改版而言那不是"对应源码"，等于违约。
        VITE_SOURCE_URL: ""
    ports:
      - "1241:1241"
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # matrix backend 跑在宿主上（非容器），容器内的 127.0.0.1 指向自己。
    # 用 host-gateway 才能让 MATRIX_BACKEND_URL 指得到宿主的 :3257。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Agent Bash 沙箱 (bwrap) 需要：
    # 1) 非特权 user namespace → 放开 docker 默认 seccomp/apparmor profile
    # 2) bwrap 嵌套出的 net namespace 内配置 loopback → 需要 NET_ADMIN
    # 宿主前置条件（测试服 .21 Ubuntu 22.04 已实测满足，无需改）：
    #   kernel.apparmor_restrict_unprivileged_userns 不存在或为 0   ← 24.04 默认为 1，容器内绕不过
    #   kernel.unprivileged_userns_clone = 1
    #   user.max_user_namespaces > 0
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data/projects:/app/projects
      - ./data/logs:/app/logs
      - ./data/claude:/root/.claude
    restart: unless-stopped
    healthcheck:
      # /health 在 MatrixSessionGate 的公开白名单里，未握手也能探活
      test: ["CMD", "curl", "-f", "http://localhost:1241/health"]
      interval: 30s
      timeout: 5s
      retries: 3
